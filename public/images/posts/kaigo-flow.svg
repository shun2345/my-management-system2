<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" width="480" height="620" role="img" aria-label="介護保険サービス利用の流れ：申請から利用開始までの5ステップ">
  <title>介護保険サービス利用の流れ</title>
  <defs>
    <style>
      .step-box { fill: #f5ede0; stroke: #1a3a5c; stroke-width: 2; rx: 12; }
      .step-num { fill: #c1492f; }
      .step-num-text { fill: #fff; font-family: sans-serif; font-size: 14px; font-weight: 700; }
      .step-title { fill: #1a1a1a; font-family: sans-serif; font-size: 15px; font-weight: 700; }
      .step-desc { fill: #6b6b6b; font-family: sans-serif; font-size: 12px; }
      .arrow { fill: #1a3a5c; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="620" fill="#f5ede0" rx="16" />

  <!-- タイトル -->
  <text x="240" y="36" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a3a5c">申請からサービス利用までの流れ</text>

  <!-- Step 1 -->
  <rect x="60" y="56" width="360" height="72" class="step-box" />
  <circle cx="96" cy="92" r="16" class="step-num" />
  <text x="96" y="97" text-anchor="middle" class="step-num-text">1</text>
  <text x="126" y="84" class="step-title">市区町村の窓口に申請</text>
  <text x="126" y="108" class="step-desc">介護保険の要介護認定申請書を提出します</text>

  <!-- Arrow 1 -->
  <polygon points="240,128 230,144 250,144" class="arrow" />
  <rect x="238" y="128" width="4" height="16" class="arrow" />

  <!-- Step 2 -->
  <rect x="60" y="158" width="360" height="72" class="step-box" />
  <circle cx="96" cy="194" r="16" class="step-num" />
  <text x="96" y="199" text-anchor="middle" class="step-num-text">2</text>
  <text x="126" y="186" class="step-title">認定調査</text>
  <text x="126" y="210" class="step-desc">調査員が自宅を訪問し心身の状態を確認します</text>

  <!-- Arrow 2 -->
  <polygon points="240,230 230,246 250,246" class="arrow" />
  <rect x="238" y="230" width="4" height="16" class="arrow" />

  <!-- Step 3 -->
  <rect x="60" y="260" width="360" height="72" class="step-box" />
  <circle cx="96" cy="296" r="16" class="step-num" />
  <text x="96" y="301" text-anchor="middle" class="step-num-text">3</text>
  <text x="126" y="288" class="step-title">審査・判定</text>
  <text x="126" y="312" class="step-desc">介護認定審査会が要介護度を判定します</text>

  <!-- Arrow 3 -->
  <polygon points="240,332 230,348 250,348" class="arrow" />
  <rect x="238" y="332" width="4" height="16" class="arrow" />

  <!-- Step 4 -->
  <rect x="60" y="362" width="360" height="72" class="step-box" />
  <circle cx="96" cy="398" r="16" class="step-num" />
  <text x="96" y="403" text-anchor="middle" class="step-num-text">4</text>
  <text x="126" y="390" class="step-title">ケアプランの作成</text>
  <text x="126" y="414" class="step-desc">ケアマネジャーとサービスの種類や頻度を相談します</text>

  <!-- Arrow 4 -->
  <polygon points="240,434 230,450 250,450" class="arrow" />
  <rect x="238" y="434" width="4" height="16" class="arrow" />

  <!-- Step 5 -->
  <rect x="60" y="464" width="360" height="72" class="step-box" />
  <circle cx="96" cy="500" r="16" class="step-num" />
  <text x="96" y="505" text-anchor="middle" class="step-num-text">5</text>
  <text x="126" y="492" class="step-title">サービスの利用開始</text>
  <text x="126" y="516" class="step-desc">在宅サービスや施設サービスの利用を開始します</text>

  <!-- 補足 -->
  <text x="240" y="568" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b6b">申請から認定まで原則30日以内</text>
  <text x="240" y="588" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b6b">出典：厚生労働省「介護保険制度の概要」</text>
</svg>
